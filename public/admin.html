<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsworthy · admin</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26' font-family='system-ui'>7</text></svg>">
<style>
  :root {
    --surface: #ffffff;
    --surface-2: #f7f7f9;
    --ink: #16161a;
    --ink-muted: #6b6b76;
    --ink-faint: #a8a8b3;
    --rule: #e6e6ea;
    --grid: #ececf0;
    --series: #3b7dd8;      /* validated: L-band, chroma, >=3:1 on #ffffff */
    --series-soft: #3b7dd81f;
    --danger: #b4342b;      /* status colour, reserved for failures only */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #101014;
      --surface-2: #17171d;
      --ink: #f2f2f5;
      --ink-muted: #9a9aa6;
      --ink-faint: #5c5c68;
      --rule: #26262e;
      --grid: #22222a;
      --series: #4d8ee8;    /* validated: L-band, chroma, >=3:1 on #101014 */
      --series-soft: #4d8ee826;
      --danger: #f08c84;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 2rem clamp(1rem, 4vw, 2rem) 4rem; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem 1rem; margin-bottom: 2rem; }
  h1 { font-size: 1.0625rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
       color: var(--ink-muted); margin: 2.5rem 0 0.875rem; }
  a { color: var(--series); }
  .spacer { flex: 1; }

  button, select {
    font: inherit; font-size: 0.8125rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 7px; padding: 0.375rem 0.75rem; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--ink-faint); }
  button[aria-pressed="true"] { background: var(--series-soft); border-color: var(--series); color: var(--series); }
  button:disabled { opacity: 0.5; cursor: progress; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1.25rem; }

  .tiles { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .tile { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px; padding: 0.875rem 1rem; }
  .tile dt { font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .tile dd { margin: 0.25rem 0 0; font-size: 1.5rem; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile dd small { font-size: 0.8125rem; color: var(--ink-faint); }

  /* align-items:end lines the button up with the selects — it drifted when the
     labels carried helper text of their own, so that moved to .note below. */
  .settings { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.75rem;
           letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
  .settings select { text-transform: none; letter-spacing: normal; font-size: 0.875rem; min-width: 170px; }
  .settings button { padding: 0.45rem 1.1rem; }
  .settings textarea, .settings input {
    font: inherit; font-size: 0.875rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 7px; padding: 0.45rem 0.6rem; min-width: 170px;
  }
  .settings textarea { width: 100%; resize: vertical; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
  #run-status { font-size: 0.8125rem; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .note { font-size: 0.75rem; color: var(--ink-faint); margin: 0.75rem 0 0; max-width: 70ch; }

  figure { margin: 0; }
  figcaption { font-size: 0.8125rem; color: var(--ink-muted); margin-bottom: 0.75rem; }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-label { fill: var(--ink-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .series-line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-area { fill: var(--series-soft); stroke: none; }
  .series-dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .crosshair { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 3 3; }
  /* Failures carry a glyph as well as colour — never colour alone. */
  .failure-mark { stroke: var(--danger); stroke-width: 1.75; stroke-linecap: round; }
  .failure-rule { stroke: var(--danger); stroke-width: 1; opacity: 0.28; stroke-dasharray: 2 4; }
  .focus-dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .tooltip {
    position: absolute; pointer-events: none; z-index: 2;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    padding: 0.5rem 0.625rem; font-size: 0.75rem; line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    width: max-content; max-width: min(260px, 60vw);
    transform: translate(-50%, -100%); transition: opacity 120ms ease;
  }
  .tooltip b { font-size: 0.9375rem; font-weight: 600; }
  .tooltip .t-time { color: var(--ink-muted); display: block; }
  .tooltip .t-why { color: var(--ink); display: block; margin-top: 0.25rem; }
  .tooltip[hidden] { display: none; }
  #focus[hidden] { display: none; }   /* SVG ignores the bare `hidden` attribute */

  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 600; color: var(--ink-muted); font-size: 0.75rem; }
  td.why { font-variant-numeric: normal; color: var(--ink-muted); }
  .pill { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.6875rem;
          border: 1px solid var(--rule); color: var(--ink-muted); }
  .pill.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
  .pill.ext { color: var(--series); border-color: color-mix(in srgb, var(--series) 40%, transparent); }
  td .muted { color: var(--ink-faint); }
  .scroll { overflow-x: auto; }
  /* Narrow screens: title on its own line so the controls stay on one row. */
  @media (max-width: 560px) {
    header h1 { flex: 1 0 100%; }
    header .spacer { display: none; }
  }
  .empty { color: var(--ink-muted); font-size: 0.875rem; padding: 2rem 0; }
  details summary { cursor: pointer; font-size: 0.8125rem; color: var(--ink-muted); }
  pre { white-space: pre-wrap; font-size: 0.75rem; background: var(--surface-2);
        border: 1px solid var(--rule); border-radius: 8px; padding: 0.875rem; overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Newsworthy · admin</h1>
    <span class="spacer"></span>
    <span id="run-status"></span>
    <button id="refresh" type="button">Rate now</button>
    <a href="/">← app</a>
  </header>

  <div class="controls" role="group" aria-label="Time range">
    <button type="button" data-hours="24" aria-pressed="false">24h</button>
    <button type="button" data-hours="168" aria-pressed="true">7d</button>
    <button type="button" data-hours="720" aria-pressed="false">30d</button>
    <button type="button" data-hours="8760" aria-pressed="false">All</button>
    <span class="spacer"></span>
    <span id="status" style="font-size:.75rem;color:var(--ink-faint)"></span>
  </div>

  <dl class="tiles" id="tiles"></dl>

  <h2>Settings</h2>
  <div class="settings">
    <label class="field">Model
      <select id="model"></select>
    </label>
    <label class="field">Rate every
      <select id="interval"></select>
    </label>
    <button id="save" type="button">Save</button>
  </div>
  <p class="note" id="settings-note"></p>

  <h2>Paste a reading</h2>
  <div class="settings">
    <label class="field" style="flex:1 1 100%">Verdict JSON
      <textarea id="paste" rows="3" placeholder='{"score": 4, "explanation": "..."}'></textarea>
    </label>
    <label class="field">From
      <input id="paste-caller" placeholder="chatgpt-agent">
    </label>
    <label class="field">Model
      <input id="paste-model" placeholder="gpt-5">
    </label>
    <button id="paste-save" type="button">Store</button>
  </div>
  <p class="note" id="paste-note">For agents whose sandbox blocks the network. Stored as an external reading.</p>

  <h2>Score over time</h2>
  <figure>
    <figcaption id="caption">Newsworthiness, 1–10 — one reading every 15 minutes.</figcaption>
    <div class="chart">
      <svg id="chart" viewBox="0 0 900 300" role="img" aria-labelledby="caption"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
  </figure>

  <h2>Recent runs</h2>
  <div class="scroll"><table id="runs">
    <thead><tr><th>When</th><th>Score</th><th>Why</th><th>Source</th><th>Model</th><th>Tokens</th><th>Cost</th><th>ms</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Prompt versions</h2>
  <div id="prompts"></div>
</div>

<script type="module">
  const qs = new URLSearchParams(location.search);
  const token = qs.get('token') || localStorage.getItem('newsworthy_token') || '';
  if (qs.get('token')) localStorage.setItem('newsworthy_token', qs.get('token'));

  const api = (path) => fetch(path, { cache: 'no-store', headers: token ? { 'x-admin-token': token } : {} });

  const $ = (id) => document.getElementById(id);
  const chart = $('chart');
  const tooltip = $('tooltip');
  const fmtTime = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtShort = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
  const fmtClock = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });

  let hours = 168;
  let points = [];
  let failures = [];

  const W = 900, H = 300, PAD = { t: 12, r: 16, b: 28, l: 30 };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;

  // Y is locked to the full 1–10 scale: auto-scaling a fixed-range rating
  // would exaggerate ordinary variation.
  const yOf = (score) => PAD.t + plotH - ((score - 1) / 9) * plotH;

  function xScale(list) {
    if (list.length === 0) return () => PAD.l;
    const t0 = list[0].t, t1 = list.at(-1).t;
    if (t1 === t0) return () => PAD.l + plotW / 2;
    return (t) => PAD.l + ((t - t0) / (t1 - t0)) * plotW;
  }

  function askForToken() {
    document.querySelector('.wrap').innerHTML =
      '<h1>Newsworthy · admin</h1><p style="color:var(--ink-muted)">This admin view needs a token.</p>' +
      '<form><input name="token" placeholder="ADMIN_TOKEN" style="font:inherit;padding:.5rem;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink)"> ' +
      '<button type="submit">Open</button></form>';
  }

  function renderTiles(data) {
    const s = data.stats ?? {};
    const current = points.at(-1);
    const tiles = [
      ['Now', current ? `${current.score}<small>/10</small>` : '–'],
      ['Average', s.avg_score != null ? s.avg_score.toFixed(1) : '–'],
      ['Range', s.min_score != null ? `${s.min_score}–${s.max_score}` : '–'],
      ['Readings', s.ok ?? 0],
      ['Failures', s.errors ?? 0],
      ['Spend', usd(s.spend_usd)],
      ...(s.external_runs ? [['By callers', `${s.external_runs}<small> · ${usd(s.external_spend_usd)}</small>`]] : []),
      ['Per run', usd(s.avg_cost_usd)],
      ['Monthly est.', usdRounded(data.projected_monthly_usd)],
    ];
    $('tiles').innerHTML = tiles
      .map(([k, v]) => `<div class="tile"><dt>${k}</dt><dd>${v}</dd></div>`)
      .join('');
  }

  /**
   * Ticks land on midnight boundaries for multi-day ranges (so labels read
   * "Aug 16, Aug 17, Aug 18", not every 1.4 days) and are evenly spaced in
   * time for short ranges.
   */
  function tickPositions(coords) {
    const t0 = coords[0].t;
    const t1 = coords.at(-1).t;
    const x = xScale(coords);
    if (t1 === t0) return [{ t: t0, cx: x(t0) }];

    const out = [];
    if (hours > 48) {
      const days = (t1 - t0) / 86_400_000;
      const step = Math.max(1, Math.ceil(days / 7));
      const cursor = new Date(t0);
      cursor.setHours(0, 0, 0, 0);
      if (cursor.getTime() < t0) cursor.setDate(cursor.getDate() + 1);
      while (cursor.getTime() <= t1) {
        out.push({ t: cursor.getTime(), cx: x(cursor.getTime()) });
        cursor.setDate(cursor.getDate() + step);
      }
    }
    if (out.length < 2) {
      const count = Math.min(6, Math.max(2, coords.length));
      for (let i = 0; i < count; i += 1) {
        const at = t0 + ((t1 - t0) * i) / (count - 1);
        out.push({ t: at, cx: x(at) });
      }
    }
    return out;
  }

  function renderChart() {
    if (points.length === 0) {
      chart.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" class="axis-label">No readings in this range yet.</text>`;
      return;
    }
    const x = xScale(points);
    const coords = points.map((p) => ({ ...p, cx: x(p.t), cy: yOf(p.score) }));

    const gridRows = [1, 4, 7, 10].map((v) => {
      const y = yOf(v);
      return `<line class="grid-line" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}"></line>
              <text class="axis-label" x="${PAD.l - 8}" y="${y + 4}" text-anchor="end">${v}</text>`;
    }).join('');

    const ticks = tickPositions(coords).map(({ t: at, cx }) => {
      const label = hours <= 48 ? fmtClock.format(at) : fmtShort.format(at);
      return `<text class="axis-label" x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${label}</text>`;
    });

    const line = coords.map((p, i) => `${i ? 'L' : 'M'}${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`).join(' ');
    const area = `${line} L${coords.at(-1).cx.toFixed(1)} ${PAD.t + plotH} L${coords[0].cx.toFixed(1)} ${PAD.t + plotH} Z`;
    const dots = coords.length <= 120
      ? coords.map((p) => `<circle class="series-dot" cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="3.5"></circle>`).join('')
      : `<circle class="series-dot" cx="${coords.at(-1).cx.toFixed(1)}" cy="${coords.at(-1).cy.toFixed(1)}" r="4"></circle>`;

    chart.innerHTML = `
      ${gridRows}${ticks.join('')}
      <path class="series-area" d="${area}"></path>
      <path class="series-line" d="${line}"></path>
      ${dots}
      ${renderFailures(x)}
      <g id="focus" hidden>
        <line class="crosshair" y1="${PAD.t}" y2="${PAD.t + plotH}"></line>
        <circle class="focus-dot" r="5.5"></circle>
      </g>
      <rect x="${PAD.l}" y="${PAD.t}" width="${plotW}" height="${plotH}" fill="transparent" id="hit"></rect>`;

    wireHover(coords);
  }

  /**
   * A failed run produces no point, so the line would otherwise stride across
   * the gap as though nothing happened. Mark each one on the baseline.
   */
  function renderFailures(x) {
    const baseline = PAD.t + plotH;
    return failures
      .map((f) => {
        const cx = x(f.t);
        if (!Number.isFinite(cx)) return '';
        const r = 3.5;
        const title = `Failed ${fmtTime.format(f.t)} — ${String(f.error ?? '').slice(0, 160)}`;
        return `<g><title>${escapeHtml(title)}</title>
          <line class="failure-rule" x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${PAD.t}" y2="${baseline}"></line>
          <line class="failure-mark" x1="${(cx - r).toFixed(1)}" y1="${baseline - r}" x2="${(cx + r).toFixed(1)}" y2="${baseline + r}"></line>
          <line class="failure-mark" x1="${(cx - r).toFixed(1)}" y1="${baseline + r}" x2="${(cx + r).toFixed(1)}" y2="${baseline - r}"></line>
        </g>`;
      })
      .join('');
  }

  function wireHover(coords) {
    const hit = chart.querySelector('#hit');
    const focus = chart.querySelector('#focus');
    const focusLine = focus.querySelector('line');
    const focusDot = focus.querySelector('circle');

    const move = (event) => {
      const box = chart.getBoundingClientRect();
      const clientX = event.touches?.[0]?.clientX ?? event.clientX;
      const svgX = ((clientX - box.left) / box.width) * W;
      let nearest = coords[0];
      for (const p of coords) {
        if (Math.abs(p.cx - svgX) < Math.abs(nearest.cx - svgX)) nearest = p;
      }
      focus.removeAttribute('hidden');
      focusLine.setAttribute('x1', nearest.cx);
      focusLine.setAttribute('x2', nearest.cx);
      focusDot.setAttribute('cx', nearest.cx);
      focusDot.setAttribute('cy', nearest.cy);

      tooltip.hidden = false;
      tooltip.innerHTML =
        `<b>${nearest.score}/10</b> <span class="t-time">${fmtTime.format(nearest.t)}</span>` +
        `<span class="t-why">${escapeHtml(nearest.explanation ?? '')}</span>`;
      // Keep the card inside the figure at both ends of the series.
      const left = (nearest.cx / W) * box.width;
      const half = tooltip.offsetWidth / 2 + 4;
      tooltip.style.left = `${Math.min(Math.max(left, half), box.width - half)}px`;
      tooltip.style.top = `${(nearest.cy / H) * box.height - 12}px`;
    };

    const leave = () => { focus.setAttribute('hidden', ''); tooltip.hidden = true; };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', leave);
    chart.addEventListener('pointerleave', leave);
  }

  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtInt = (n) => (n == null ? '' : Number(n).toLocaleString());
  const shortModel = (m) => String(m).replace(/^claude-/, '');
  const usd = (n) => (n == null ? '–' : n < 1 ? `$${n.toFixed(4)}` : `$${n.toFixed(2)}`);
  const usdRounded = (n) => (n == null ? '–' : `$${Math.round(n).toLocaleString()}`);
  /** External readings name their caller; ours just say how they were triggered. */
  const sourceCell = (r) =>
    r.source === 'external'
      ? `<span class="pill ext" title="${escapeHtml(JSON.stringify(r.caller_meta ?? {}))}">${escapeHtml(r.caller ?? 'external')}</span>`
      : `<span class="muted">${escapeHtml(r.source ?? 'cron')}</span>`;

  function renderRuns(rows) {
    $('runs').querySelector('tbody').innerHTML = rows.map((r) => `
      <tr>
        <td>${fmtTime.format(new Date(r.created_at))}</td>
        <td>${r.status === 'ok' ? `${r.score}/10` : '<span class="pill err">failed</span>'}</td>
        <td class="why">${escapeHtml(r.status === 'ok' ? r.explanation ?? '' : r.error ?? '')}</td>
        <td>${sourceCell(r)}</td>
        <td>${escapeHtml(shortModel(r.served_by ?? r.model))}</td>
        <td>${r.input_tokens != null ? `${fmtInt(r.input_tokens)} / ${fmtInt(r.output_tokens)}` : ''}</td>
        <td>${r.cost_usd != null ? usd(r.cost_usd) : ''}</td>
        <td>${r.latency_ms ?? ''}</td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">Nothing logged yet.</td></tr>';
  }

  async function renderPrompts() {
    const res = await api('/api/admin/prompts');
    if (!res.ok) return;
    const { prompts } = await res.json();
    $('prompts').innerHTML = prompts.map((p) => `
      <details>
        <summary>v${p.version} · ${escapeHtml(p.label)} · ${escapeHtml(p.hash)} · added ${escapeHtml(p.added)}</summary>
        <pre>${escapeHtml(p.text)}</pre>
      </details>`).join('');
  }

  async function load() {
    $('status').textContent = 'loading…';
    const res = await api(`/api/admin/history?hours=${hours}`);
    if (res.status === 401) return askForToken();
    const data = await res.json();
    points = data.points.map((p) => ({ ...p, t: Date.parse(p.created_at) }));
    failures = (data.failures ?? []).map((f) => ({ ...f, t: Date.parse(f.created_at) }));
    renderTiles(data);
    renderChart();
    renderRuns(data.attempts);
    $('caption').textContent =
      `Newsworthiness 1–10 · ${points.length} reading${points.length === 1 ? '' : 's'}` +
      (failures.length ? ' · ✕ marks a failed run' : '');
    $('status').textContent = `updated ${fmtClock.format(new Date())}`;
  }

  for (const button of document.querySelectorAll('[data-hours]')) {
    button.addEventListener('click', () => {
      hours = Number(button.dataset.hours);
      for (const other of document.querySelectorAll('[data-hours]')) {
        other.setAttribute('aria-pressed', String(other === button));
      }
      load();
    });
  }

  let settings = null;

  async function loadSettings() {
    const res = await api('/api/admin/settings');
    if (!res.ok) return;
    settings = await res.json();

    $('model').innerHTML = settings.models
      .map((m) => `<option value="${m.id}"${m.id === settings.model ? ' selected' : ''}>${escapeHtml(m.label)}</option>`)
      .join('');
    $('interval').innerHTML = settings.intervals
      .map((i) => `<option value="${i.minutes}"${i.minutes === settings.interval_minutes ? ' selected' : ''}>${escapeHtml(i.label)}</option>`)
      .join('');
    renderEstimates();
  }

  /**
   * Preview the cost of a *pending* change only. When the dropdowns match what
   * is saved, the tiles above already show per-run and monthly spend, so
   * repeating them here was noise.
   */
  function renderEstimates() {
    if (!settings) return;
    const model = settings.models.find((m) => m.id === $('model').value);
    const minutes = Number($('interval').value);
    if (!model) return;
    if (model.id === settings.model && minutes === settings.interval_minutes) {
      $('settings-note').textContent = '';
      return;
    }
    const perMonth = model.typical_run_usd * (60 / minutes) * 24 * 30.44;
    const every = settings.intervals.find((i) => i.minutes === minutes)?.label ?? `${minutes} min`;
    $('settings-note').textContent =
      `${model.label} every ${every} ≈ ${usdRounded(perMonth)}/month — Save to apply.`;
  }

  $('model').addEventListener('change', renderEstimates);
  $('interval').addEventListener('change', renderEstimates);

  $('save').addEventListener('click', async () => {
    const button = $('save');
    button.disabled = true;
    $('settings-note').textContent = 'Saving…';
    try {
      const res = await fetch('/api/admin/settings', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...(token ? { 'x-admin-token': token } : {}) },
        body: JSON.stringify({ model: $('model').value, intervalMinutes: Number($('interval').value) }),
      });
      const body = await res.json();
      if (res.ok) {
        settings.model = body.model;
        settings.interval_minutes = body.interval_minutes;
        $('settings-note').textContent = 'Saved. Takes effect on the next reading.';
        await load();
      } else {
        $('settings-note').textContent = `Failed: ${body.error ?? res.statusText}`;
      }
    } finally {
      button.disabled = false;
    }
  });

  /**
   * Some agents can produce a verdict but cannot submit it: their sandbox
   * refuses a model-synthesized URL carrying a token, or blocks the network
   * outright. Rather than lose the reading, take the JSON they printed and
   * submit it here. It is stored as external, like any other caller reading.
   */
  $('paste-save').addEventListener('click', async () => {
    const button = $('paste-save');
    const note = $('paste-note');
    let payload;
    try {
      payload = JSON.parse($('paste').value);
    } catch {
      note.textContent = 'That is not valid JSON.';
      return;
    }
    const caller = $('paste-caller').value.trim();
    const model = $('paste-model').value.trim();
    if (caller) payload.caller = caller;
    if (model) payload.model = model;

    button.disabled = true;
    note.textContent = 'Storing…';
    try {
      const res = await fetch('/api/readings', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...(token ? { 'x-admin-token': token } : {}) },
        body: JSON.stringify(payload),
      });
      const body = await res.json();
      if (res.ok) {
        note.textContent = `Stored as reading ${body.id ?? ''}.`.trim();
        $('paste').value = '';
        await load();
      } else {
        note.textContent = `Rejected: ${body.error ?? res.statusText}`;
      }
    } finally {
      button.disabled = false;
    }
  });

  /**
   * A real rating takes about a minute — it searches the web and calls Opus.
   * Without a running counter the button looked dead, so show elapsed time and
   * report the outcome, including failures.
   */
  $('refresh').addEventListener('click', async () => {
    const button = $('refresh');
    const status = $('run-status');
    const startedAt = Date.now();
    const ticker = setInterval(() => {
      status.textContent = `Rating… ${Math.round((Date.now() - startedAt) / 1000)}s`;
    }, 1000);
    status.textContent = 'Rating… 0s';
    button.disabled = true; // the status carries the message; the label stays put
    try {
      // Same endpoint Vercel Cron calls; force=1 bypasses the slot guard so a
      // manual run is never swallowed as a duplicate.
      const res = await fetch('/api/cron?force=1', {
        method: 'POST',
        headers: token ? { 'x-admin-token': token } : {},
      });
      const body = await res.json().catch(() => ({}));
      clearInterval(ticker);
      if (!res.ok) {
        status.textContent = `Failed: ${body.error ?? res.statusText}`;
      } else if (body.status === 'ok') {
        const cost = body.cost_usd != null ? ` · ${usd(body.cost_usd)}` : '';
        status.textContent = `${body.score}/10${cost}`;
      } else {
        status.textContent = 'Run failed — see Recent runs';
      }
      await load();
    } catch {
      status.textContent = 'Interrupted — the run may still finish; reload shortly.';
    } finally {
      clearInterval(ticker);
      button.disabled = false;
    }
  });

  await load();
  await loadSettings();
  await renderPrompts();
  setInterval(load, 60_000);
  window.addEventListener('resize', renderChart);
</script>
</body>
</html>
