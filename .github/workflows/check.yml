name: Check Newsworthy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:app
      - name: Cross-surface design contract and regression checks
        run: npm run test:design
      - run: npm test
      - run: npx expo export --platform ios --platform android
        working-directory: apps/client
      - run: npx expo prebuild --no-install
        working-directory: apps/client
