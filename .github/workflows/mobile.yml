name: Build Expo mobile apps
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, development, simulator, production]
        default: preview
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:app
      - run: npm run mobile:check
      - name: Require EAS account setup
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Add the EXPO_TOKEN GitHub secret after EAS setup.'; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo 'Add the EXPO_PROJECT_ID repository variable.'; exit 1; }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build in EAS
        working-directory: apps/client
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$BUILD_PROFILE" = simulator ] && [ "$BUILD_PLATFORM" != ios ]; then
            echo 'The simulator profile requires the ios platform.'; exit 1
          fi
          eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive
